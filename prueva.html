<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="calculadora">
    
    <!-- Pantalla -->
    <div class="pantalla">
      <div class="pantalla__historial" id="historial"></div>
      <div class="pantalla__resultado" id="resultado">0</div>
    </div>

    <!-- Teclado -->
    <div class="teclado">

      <!-- Fila 1: funciones -->
      <button class="tecla tecla--funcion" data-accion="limpiar">C</button>
      <button class="tecla tecla--funcion" data-accion="borrar">⌫</button>
      <button class="tecla tecla--funcion" data-accion="porcentaje">%</button>
      <button class="tecla tecla--operador" data-operador="/">÷</button>

      <!-- Fila 2 -->
      <button class="tecla tecla--numero" data-numero="7">7</button>
      <button class="tecla tecla--numero" data-numero="8">8</button>
      <button class="tecla tecla--numero" data-numero="9">9</button>
      <button class="tecla tecla--operador" data-operador="*">×</button>

      <!-- Fila 3 -->
      <button class="tecla tecla--numero" data-numero="4">4</button>
      <button class="tecla tecla--numero" data-numero="5">5</button>
      <button class="tecla tecla--numero" data-numero="6">6</button>
      <button class="tecla tecla--operador" data-operador="-">−</button>

      <!-- Fila 4 -->
      <button class="tecla tecla--numero" data-numero="1">1</button>
      <button class="tecla tecla--numero" data-numero="2">2</button>
      <button class="tecla tecla--numero" data-numero="3">3</button>
      <button class="tecla tecla--operador" data-operador="+">+</button>

      <!-- Fila 5 -->
      <button class="tecla tecla--numero tecla--cero" data-numero="0">0</button>
      <button class="tecla tecla--numero" data-numero=".">.</button>
      <button class="tecla tecla--igual" data-accion="igual">=</button>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
