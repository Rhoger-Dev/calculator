<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Libro de Cuentas — Calculadora</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Courier+Prime:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

        <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="book">
        <!-- PÁGINA IZQUIERDA: el historial, como un libro mayor de cuentas -->
        <section class="page page-left">
            <div class="ribbon" id="ribbon" title="Tirar del marcador para borrar el historial">
                <span class="ribbon-label">limpiar</span>
            </div>
            <h1 class="page-title">Libro de Cuentas</h1>
            <p class="page-subtitle">registro de operaciones</p>
            <div class="history" id="history">
                <p class="empty-note">Aún no hay entradas en esta página...</p>
            </div>
        </section>

        <div class="spine"></div>

        <!-- PÁGINA DERECHA: el visor y las teclas -->
        <section class="page page-right">
            <div class="display-paper">
                <div class="expression" id="expression">&nbsp;</div>
                <div class="result" id="result">0</div>
            </div>

            <div class="keypad" id="keypad">
                <button class="key wide" data-action="clear">C</button>
                <button class="key" data-action="backspace">⌫</button>
                <button class="key op" data-action="operator" data-value="÷">÷</button>

                <button class="key" data-action="digit" data-value="7">7</button>
                <button class="key" data-action="digit" data-value="8">8</button>
                <button class="key" data-action="digit" data-value="9">9</button>
                <button class="key op" data-action="operator" data-value="×">×</button>

                <button class="key" data-action="digit" data-value="4">4</button>
                <button class="key" data-action="digit" data-value="5">5</button>
                <button class="key" data-action="digit" data-value="6">6</button>
                <button class="key op" data-action="operator" data-value="−">−</button>

                <button class="key" data-action="digit" data-value="1">1</button>
                <button class="key" data-action="digit" data-value="2">2</button>
                <button class="key" data-action="digit" data-value="3">3</button>
                <button class="key op" data-action="operator" data-value="+">+</button>

                <button class="key" data-action="digit" data-value="0">0</button>
                <button class="key" data-action="decimal">.</button>
                <button class="key equals" data-action="equals">=</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
