Calculadora libro · HTML
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>El Libro de Cuentas — Calculadora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Courier+Prime:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <style>
        /* ============================================
     1) VARIABLES DE DISEÑO (paleta "libro antiguo")
     ============================================ */
        :root {
            --cover: #2e1b0f;
            --cover-hi: #4a2e18;
            --gold: #b08d45;
            --gold-soft: #d8b96a;
            --page: #f1e7cf;
            --page-shadow: #dccba0;
            --ink: #2a2018;
            --ink-faint: #7a6a53;
            --wax: #7b2d26;
            --wax-dark: #5b1f1a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 50% 20%, #3a2a1e 0%, #1a120b 70%);
            font-family: 'Crimson Text', serif;
            padding: 40px 16px;
        }

        /* ============================================
     2) EL LIBRO — portada, lomo y perspectiva 3D
     ============================================ */
        .book {
            position: relative;
            display: flex;
            width: min(720px, 94vw);
            min-height: 460px;
            background: linear-gradient(180deg, var(--cover-hi), var(--cover));
            border-radius: 10px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, .55),
                0 2px 0 rgba(255, 255, 255, .05) inset;
            padding: 14px;
            gap: 0;
        }

        .spine {
            width: 22px;
            background:
                repeating-linear-gradient(180deg,
                    var(--gold) 0px, var(--gold) 2px,
                    transparent 2px, transparent 10px),
                linear-gradient(180deg, #1f130b, #120b06);
            border-radius: 3px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, .6);
            flex-shrink: 0;
            margin: 0 4px;
        }

        .page {
            background:
                radial-gradient(ellipse at top left, rgba(255, 255, 255, .25), transparent 40%),
                var(--page);
            border-radius: 4px;
            padding: 22px 22px 18px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: inset 0 0 30px rgba(120, 95, 50, .25);
        }

        .page-left {
            flex: 1 1 44%;
        }

        .page-right {
            flex: 1 1 56%;
        }

        /* textura sutil de papel */
        .page::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(transparent, transparent 27px, rgba(120, 95, 50, .06) 28px);
            pointer-events: none;
            border-radius: 4px;
        }

        /* ============================================
     3) PÁGINA IZQUIERDA — el "libro mayor" (historial)
     ============================================ */
        .page-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--ink);
            margin: 0 0 4px;
            letter-spacing: .5px;
        }

        .page-subtitle {
            font-style: italic;
            color: var(--ink-faint);
            font-size: .85rem;
            margin: 0 0 14px;
            border-bottom: 1px solid var(--page-shadow);
            padding-bottom: 10px;
        }

        .ribbon {
            position: absolute;
            top: -6px;
            right: 26px;
            width: 26px;
            height: 90px;
            background: linear-gradient(180deg, var(--wax), var(--wax-dark));
            clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, .35);
            transition: transform .15s ease;
            z-index: 5;
        }

        .ribbon:hover {
            transform: translateY(3px);
        }

        .ribbon:active {
            transform: translateY(6px);
        }

        .ribbon-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 8px;
            color: var(--gold-soft);
            font-size: .65rem;
            font-family: 'Playfair Display', serif;
        }

        .history {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            color: var(--ink);
        }

        .history::-webkit-scrollbar {
            width: 6px;
        }

        .history::-webkit-scrollbar-thumb {
            background: var(--page-shadow);
            border-radius: 3px;
        }

        .entry {
            font-size: .95rem;
            line-height: 1.5;
            margin-bottom: 10px;
            animation: inkIn .35s ease;
        }

        .entry .num {
            color: var(--ink-faint);
            font-style: italic;
            margin-right: 6px;
        }

        .entry .expr {
            color: var(--ink-faint);
        }

        .entry .eq {
            color: var(--wax);
            font-weight: 600;
        }

        .empty-note {
            color: var(--ink-faint);
            font-style: italic;
            font-size: .9rem;
            margin-top: 20px;
        }

        @keyframes inkIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
     4) PÁGINA DERECHA — visor + teclado
     ============================================ */
        .display-paper {
            background: linear-gradient(180deg, #fbf6e8, var(--page));
            border: 1px solid var(--page-shadow);
            border-radius: 4px;
            padding: 14px 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .08) inset;
            position: relative;
            min-height: 84px;
        }

        .expression {
            font-family: 'Courier Prime', monospace;
            color: var(--ink-faint);
            font-size: 1rem;
            min-height: 1.3em;
            text-align: right;
            letter-spacing: .5px;
        }

        .result {
            font-family: 'Courier Prime', monospace;
            font-weight: 700;
            color: var(--ink);
            font-size: 2rem;
            text-align: right;
            letter-spacing: 1px;
            word-break: break-all;
            transform-origin: right center;
        }

        /* el "sello de tinta" al presionar "=" */
        .result.stamp {
            animation: stampIt .32s cubic-bezier(.36, 1.6, .4, 1);
        }

        @keyframes stampIt {
            0% {
                transform: scale(1.6) rotate(-4deg);
                opacity: 0;
                color: var(--wax);
            }

            60% {
                transform: scale(0.96) rotate(1deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0);
                color: var(--ink);
            }
        }

        .keypad {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button.key {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--ink);
            background: linear-gradient(180deg, #e9dcb8, #ddcda0);
            border: 1px solid var(--page-shadow);
            border-radius: 6px;
            cursor: pointer;
            padding: 12px 0;
            box-shadow: 0 2px 0 rgba(120, 95, 50, .4);
            transition: transform .08s ease, box-shadow .08s ease;
        }

        button.key:hover {
            filter: brightness(1.04);
        }

        button.key:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 rgba(120, 95, 50, .4);
        }

        button.key.op {
            background: linear-gradient(180deg, var(--wax), var(--wax-dark));
            color: #f1e7cf;
            border-color: var(--wax-dark);
        }

        button.key.equals {
            grid-column: span 2;
            background: linear-gradient(180deg, var(--gold), #8a6a2e);
            color: #2a1c08;
            border-color: #8a6a2e;
        }

        button.key.wide {
            grid-column: span 2;
        }

        /* foco visible por teclado (accesibilidad) */
        button.key:focus-visible {
            outline: 2px solid var(--wax);
            outline-offset: 2px;
        }

        /* ============================================
     5) RESPONSIVE — el libro se cierra en móvil
     ============================================ */
        @media (max-width: 640px) {
            .book {
                flex-direction: column;
                min-height: auto;
            }

            .spine {
                width: auto;
                height: 14px;
                margin: 4px 0;
                background: repeating-linear-gradient(90deg,
                        var(--gold) 0px, var(--gold) 2px, transparent 2px, transparent 10px),
                    linear-gradient(90deg, #1f130b, #120b06);
            }

            .history {
                max-height: 140px;
            }
        }
    </style>
</head>

<body>

    <div class="book">
        <!-- PÁGINA IZQUIERDA: el historial, como un libro mayor de cuentas -->
        <section class="page page-left">
            <div class="ribbon" id="ribbon" title="Tirar del marcador para borrar el historial">
                <span class="ribbon-label">limpiar</span>
            </div>
            <h1 class="page-title">Libro de Cuentas</h1>
            <p class="page-subtitle">registro de operaciones</p>
            <div class="history" id="history">
                <p class="empty-note">Aún no hay entradas en esta página...</p>
            </div>
        </section>

        <div class="spine"></div>

        <!-- PÁGINA DERECHA: el visor y las teclas -->
        <section class="page page-right">
            <div class="display-paper">
                <div class="expression" id="expression">&nbsp;</div>
                <div class="result" id="result">0</div>
            </div>

            <div class="keypad" id="keypad">
                <button class="key wide" data-action="clear">C</button>
                <button class="key" data-action="backspace">⌫</button>
                <button class="key op" data-action="operator" data-value="÷">÷</button>

                <button class="key" data-action="digit" data-value="7">7</button>
                <button class="key" data-action="digit" data-value="8">8</button>
                <button class="key" data-action="digit" data-value="9">9</button>
                <button class="key op" data-action="operator" data-value="×">×</button>

                <button class="key" data-action="digit" data-value="4">4</button>
                <button class="key" data-action="digit" data-value="5">5</button>
                <button class="key" data-action="digit" data-value="6">6</button>
                <button class="key op" data-action="operator" data-value="−">−</button>

                <button class="key" data-action="digit" data-value="1">1</button>
                <button class="key" data-action="digit" data-value="2">2</button>
                <button class="key" data-action="digit" data-value="3">3</button>
                <button class="key op" data-action="operator" data-value="+">+</button>

                <button class="key" data-action="digit" data-value="0">0</button>
                <button class="key" data-action="decimal">.</button>
                <button class="key equals" data-action="equals">=</button>
            </div>
        </section>
    </div>

    <script>
        /* ============================================
           6) ESTADO DE LA CALCULADORA
           ============================================
           Guardamos todo en un único objeto "state".
           Esto es más fácil de razonar que tener
           variables sueltas por todos lados. */
        const state = {
            current: '0',       // lo que se ve en pantalla ahora mismo
            previous: null,      // el número guardado antes de elegir un operador
            operator: null,       // '+', '−', '×' o '÷'
            waitingForNext: false, // true justo después de pulsar un operador
            history: []           // lista de operaciones ya resueltas
        };

        const resultEl = document.getElementById('result');
        const exprEl = document.getElementById('expression');
        const historyEl = document.getElementById('history');
        const ribbon = document.getElementById('ribbon');
        const keypad = document.getElementById('keypad');

        /* ============================================
           7) FUNCIONES PURAS DE CÁLCULO
           ============================================ */
        function calculate(a, operator, b) {
            a = parseFloat(a);
            b = parseFloat(b);
            switch (operator) {
                case '+': return a + b;
                case '−': return a - b;
                case '×': return a * b;
                case '÷': return b === 0 ? NaN : a / b;
                default: return b;
            }
        }

        // Evita mostrar 0.30000000000000004 y números eternos
        function formatNumber(n) {
            if (Number.isNaN(n)) return 'Error';
            if (!isFinite(n)) return 'Error';
            const rounded = Math.round(n * 1e9) / 1e9;
            return rounded.toString();
        }

        /* ============================================
           8) ACCIONES — cada botón dispara una de estas
           ============================================ */
        function inputDigit(d) {
            if (state.waitingForNext) {
                state.current = d;
                state.waitingForNext = false;
            } else {
                state.current = state.current === '0' ? d : state.current + d;
            }
        }

        function inputDecimal() {
            if (state.waitingForNext) {
                state.current = '0.';
                state.waitingForNext = false;
                return;
            }
            if (!state.current.includes('.')) state.current += '.';
        }

        function chooseOperator(op) {
            // Si ya había un operador pendiente, resolvemos esa cuenta primero
            // (esto permite encadenar: 2 + 3 + 4 =)
            if (state.operator && !state.waitingForNext) {
                const result = calculate(state.previous, state.operator, state.current);
                state.previous = formatNumber(result);
                state.current = state.previous;
            } else {
                state.previous = state.current;
            }
            state.operator = op;
            state.waitingForNext = true;
        }

        function equals() {
            if (state.operator === null) return;
            const expr = `${state.previous} ${state.operator} ${state.current}`;
            const result = calculate(state.previous, state.operator, state.current);
            const formatted = formatNumber(result);

            addHistoryEntry(expr, formatted);

            state.current = formatted;
            state.previous = null;
            state.operator = null;
            state.waitingForNext = true; // el próximo dígito empieza una cuenta nueva

            // el "sello de tinta": quitamos y volvemos a poner la clase para
            // que la animación se repita cada vez
            resultEl.classList.remove('stamp');
            void resultEl.offsetWidth; // truco para reiniciar la animación CSS
            resultEl.classList.add('stamp');
        }

        function backspace() {
            state.current = state.current.length > 1 ? state.current.slice(0, -1) : '0';
        }

        function clearAll() {
            state.current = '0';
            state.previous = null;
            state.operator = null;
            state.waitingForNext = false;
        }

        /* ============================================
           9) HISTORIAL — la página izquierda
           ============================================ */
        function addHistoryEntry(expr, result) {
            state.history.unshift({ expr, result, n: state.history.length + 1 });
            renderHistory();
        }

        function renderHistory() {
            if (state.history.length === 0) {
                historyEl.innerHTML = '<p class="empty-note">Aún no hay entradas en esta página...</p>';
                return;
            }
            historyEl.innerHTML = state.history.map(item => `
    <div class="entry">
      <span class="num">${item.n}.</span>
      <span class="expr">${item.expr}</span>
      <span class="eq"> = ${item.result}</span>
    </div>
  `).join('');
        }

        /* ============================================
           10) RENDER — sincroniza el "state" con el DOM
           ============================================ */
        function render() {
            resultEl.textContent = state.current;
            exprEl.textContent = state.previous !== null
                ? `${state.previous} ${state.operator}`
                : '\u00A0'; // espacio no separable para mantener la altura de la línea
        }

        /* ============================================
           11) EVENTOS — clics del teclado del libro
           ============================================ */
        keypad.addEventListener('click', (e) => {
            const btn = e.target.closest('button.key');
            if (!btn) return;
            const action = btn.dataset.action;
            const value = btn.dataset.value;

            if (action === 'digit') inputDigit(value);
            else if (action === 'decimal') inputDecimal();
            else if (action === 'operator') chooseOperator(value);
            else if (action === 'equals') equals();
            else if (action === 'backspace') backspace();
            else if (action === 'clear') clearAll();

            render();
        });

        // El marcador de tela (ribbon) también limpia todo, con un pequeño gesto
        ribbon.addEventListener('click', () => {
            clearAll();
            state.history = [];
            renderHistory();
            render();
        });

        /* ============================================
           12) SOPORTE DE TECLADO FÍSICO
           ============================================ */
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
            else if (e.key === '.') inputDecimal();
            else if (e.key === '+') chooseOperator('+');
            else if (e.key === '-') chooseOperator('−');
            else if (e.key === '*') chooseOperator('×');
            else if (e.key === '/') { e.preventDefault(); chooseOperator('÷'); }
            else if (e.key === 'Enter' || e.key === '=') equals();
            else if (e.key === 'Backspace') backspace();
            else if (e.key === 'Escape') clearAll();
            else return;

            render();
        });

        render(); // primer dibujado al cargar la página
    </script>
</body>

</html>
